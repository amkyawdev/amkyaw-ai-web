<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Full Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white overflow-hidden">


    <div class="flex h-screen w-screen overflow-hidden">
        
        <aside class="w-64 bg-[#0f172a] text-white flex flex-col sidemenu" id="sidemenu">
            <div class="p-4 flex items-center justify-between border-b border-gray-800">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-1.5 rounded-lg text-sm">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <span class="font-semibold tracking-tight">AI Assistant</span>
                </div>
                <button id="close-sidemenu" class="text-gray-400 hover:text-white transition p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>


            <div class="p-3">
                <div class="flex bg-[#1e293b] p-1 rounded-xl gap-1">
                    <button class="flex-1 bg-gray-700 py-1.5 rounded-lg text-xs font-medium">Chats</button>
                    <button class="flex-1 hover:bg-gray-700/50 py-1.5 rounded-lg text-xs font-medium text-gray-400 transition">Settings</button>
                </div>
                
                <button class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-900/20" id="new-chat-btn">
                    <i class="fa-solid fa-plus text-xs"></i> New Chat
                </button>
            </div>


            <div class="flex-1 overflow-y-auto px-3 mt-2" id="chat-history">
                <p class="text-[10px] text-gray-500 uppercase font-bold mb-4 px-2 tracking-widest">Recent Chats</p>
                <div class="space-y-1" id="chat-list">
                    <!-- Chat items will be added here -->
                </div>
            </div>


            <div class="p-4 border-t border-gray-800">
                <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer transition">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xs font-bold">AA</div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-xs font-medium truncate">Amkyaw AI</p>
                        <p class="text-[10px] text-gray-500 truncate">Powered by Local CSV</p>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical text-gray-500 text-xs"></i>
                </div>
            </div>
        </aside>


        <main class="flex-1 flex flex-col bg-[#fcfcfd] relative">
            
            <header class="h-14 border-b border-gray-100 flex items-center justify-between px-6 bg-white/80 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <button id="menu-toggle" class="text-gray-500 hover:text-indigo-600 transition md:hidden" title="Toggle Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="text-xs font-medium text-gray-400 uppercase tracking-widest"> Amkyaw AI Chat</span>
                </div>
                <div class="flex items-center gap-4 text-gray-500">
                    <button class="hover:text-indigo-600 transition" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
                    <button class="hover:text-indigo-600 transition" title="Expand"><i class="fa-solid fa-expand"></i></button>
                </div>
            </header>


            <div class="flex-1 overflow-y-auto flex flex-col items-center pb-24" id="chat-container">
                
                <div class="mt-24 mb-12 flex flex-col items-center text-center px-6" id="welcome-screen">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center text-4xl mb-6 shadow-sm border border-indigo-100/50">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-3 tracking-tight">How can I help you today?</h1>
                    <p class="text-gray-500 max-w-md leading-relaxed text-sm">
                        I'm your AI assistant. I can help you with anything from code to creative writing.
                    </p>
                </div>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-2xl px-6 mb-12" id="suggestion-buttons">
                    <button class="p-4 text-left border border-gray-200 rounded-2xl hover:bg-indigo-50 hover:border-indigo-200 transition group shadow-sm bg-white suggestion-btn">
                        <p class="text-xs font-bold text-indigo-600 uppercase mb-1 opacity-0 group-hover:opacity-100 transition">Action</p>
                        <p class="text-sm text-gray-700 font-medium">Explain quantum physics to a 5-year-old</p>
                    </button>
                    <button class="p-4 text-left border border-gray-200 rounded-2xl hover:bg-indigo-50 hover:border-indigo-200 transition group shadow-sm bg-white suggestion-btn">
                        <p class="text-xs font-bold text-indigo-600 uppercase mb-1 opacity-0 group-hover:opacity-100 transition">Creative</p>
                        <p class="text-sm text-gray-700 font-medium">Write a poem about neural networks</p>
                    </button>
                </div>
            </div>


            <footer class="w-full max-w-3xl mx-auto p-6 fixed bottom-0 left-0 right-0">
                <div class="relative flex items-end bg-white border border-gray-200 rounded-2xl p-2 shadow-xl focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-500 transition-all duration-300">
                    <textarea 
                        id="user-input"
                        rows="1"
                        placeholder="Message AI Assistant..." 
                        class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-gray-700 resize-none max-h-40"
                    ></textarea>
                    
                    <div class="flex items-center gap-2 p-1">
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-200 transition" id="send-btn">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                <p class="text-center text-[11px] text-gray-400 mt-4 font-medium">
                    AI-generated content may be inaccurate. Please verify.
                </p>
            </footer>


        </main>
    </div>


    <script type="module" src="js/main.js"></script>
</body>
</html>
